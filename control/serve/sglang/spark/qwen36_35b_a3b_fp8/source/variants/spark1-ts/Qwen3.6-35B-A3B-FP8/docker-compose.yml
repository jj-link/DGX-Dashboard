services:
  qwen36-a3b-fp8:
    image: lmsysorg/sglang:v0.5.12-cu130
    container_name: sglang-qwen36-a3b-fp8
    restart: "no"
    ports:
      - "8000:30000"
    ipc: host
    shm_size: 32g
    volumes:
      - ${HOME}/models:/models
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: /models
      SGLANG_ENABLE_SPEC_V2: "1"
      SGLANG_ENABLE_JIT_DEEPGEMM: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - /models/hub/models--Qwen--Qwen3.6-35B-A3B-FP8/snapshots/95a723d08a9490559dae23d0cff1d9466213d989
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --served-model-name
      - Qwen3.6-35B-A3B-FP8
      - --trust-remote-code
      - --tp-size
      - "1"
      - --attention-backend
      - flashinfer
      - --context-length
      - "262144"
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      - --mem-fraction-static
      - "0.85"
      - --enable-metrics
      - --max-running-requests
      - "4"
      - --chunked-prefill-size
      - "2048"
