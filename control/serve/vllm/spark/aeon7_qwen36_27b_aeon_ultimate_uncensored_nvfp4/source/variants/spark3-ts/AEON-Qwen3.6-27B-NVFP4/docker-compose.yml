services:
  aeon-ultimate:
    image: ghcr.io/aeon-7/aeon-vllm-ultimate:latest
    container_name: vllm-aeon-ultimate
    restart: "no"
    ports:
      - "8002:8000"
    ipc: host
    shm_size: 32g
    volumes:
      - ${HOME}/models:/models:ro
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: /models
      TORCH_CUDA_ARCH_LIST: "12.1a"
      ENABLE_NVFP4_SM100: "0"
      VLLM_USE_FLASHINFER_MOE_FP4: "0"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: vllm
    command: >
      serve /models/hub/models--AEON-7--Qwen3.6-27B-AEON-Ultimate-Uncensored-NVFP4/snapshots/f3891cf010d9e84ad92500169906ef365b26e9cb
        --served-model-name aeon-ultimate
        --host 0.0.0.0 --port 8000
        --quantization compressed-tensors
        --mamba-cache-dtype float32
        --max-model-len 256000
        --max-num-seqs 64
        --max-num-batched-tokens 16384
        --gpu-memory-utilization 0.85
        --enable-chunked-prefill
        --enable-prefix-caching
        --load-format safetensors
        --trust-remote-code
        --enable-auto-tool-choice
        --tool-call-parser qwen3_coder
        --reasoning-parser qwen3
        --attention-backend flash_attn
        --limit-mm-per-prompt '{"image":4,"video":2}'
        --mm-encoder-tp-mode data
        --mm-processor-cache-type shm
        --speculative-config '{"method":"dflash","model":"/models/dflash-drafter","num_speculative_tokens":10}'
