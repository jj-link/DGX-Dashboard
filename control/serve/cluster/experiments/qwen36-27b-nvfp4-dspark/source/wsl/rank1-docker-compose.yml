services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-qwen36-tp2
    restart: "no"
    privileged: true
    network_mode: host
    ipc: host
    shm_size: 32g
    ulimits:
      memlock: -1
    gpus: all
    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      - /home/jjlink/models/hub:/models
      - /home/jjlink/models/token:/hf_token:ro
    environment:
      HF_HOME: /models
      HF_HUB_DISABLE_XET: "1"
      HF_TOKEN_FILE: /hf_token
      VLLM_HOST_IP: "10.0.0.2"

      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_SKIP_INIT_MEMORY_CHECK: "1"

      NCCL_NET: "IB"
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: rocep1s0f1
      NCCL_SOCKET_IFNAME: enp1s0f1np1
      NCCL_IB_GID_INDEX: "3"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: "WARN"
      NCCL_NVLS_ENABLE: "0"
      GLOO_SOCKET_IFNAME: enp1s0f1np1
      TP_SOCKET_IFNAME: enp1s0f1np1

      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

    command:
      - bash
      - -lc
      - |
        export PATH="/opt/env/bin:/opt/env/nvvm/bin:/opt/env/targets/sbsa-linux/nvvm/bin:${PATH:-}";
        export CUDA_HOME="${CUDA_HOME:-/opt/env/targets/sbsa-linux}";
        export CUDA_PATH="${CUDA_PATH:-${CUDA_HOME}}";
        export CUDAToolkit_ROOT="${CUDAToolkit_ROOT:-${CUDA_HOME}}";
        export LD_LIBRARY_PATH="/opt/env/lib:/opt/env/targets/sbsa-linux/lib:${LD_LIBRARY_PATH:-}";
        exec /opt/env/bin/vllm serve nvidia/Qwen3.6-27B-NVFP4
        --served-model-name qwen36-27b-nvfp4
        --host 0.0.0.0
        --port 8888
        --trust-remote-code
        --tensor-parallel-size 2
        --max-model-len 262144
        --gpu-memory-utilization 0.90
        --max-cudagraph-capture-size 8
        --enable-prefix-caching
        --load-format safetensors
        --tokenizer-mode auto
        --distributed-executor-backend mp
        --nnodes 2
        --node-rank 1
        --master-addr 10.0.0.1
        --master-port 25000