services:
  ornith-9b-nvfp4:
    image: lmsysorg/sglang:v0.5.12-cu130
    container_name: sglang-ornith-9b-nvfp4
    restart: "no"
    ports:
      - "8000:30000"
    ipc: host
    shm_size: 32g
    volumes:
      - ${HOME}/models:/models
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: /models
      SGLANG_ENABLE_SPEC_V2: "1"
      SGLANG_ENABLE_JIT_DEEPGEMM: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - Luni/Ornith-1.0-9B-NVFP4-AWQ
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --served-model-name
      - Ornith-1.0-9B-NVFP4-AWQ
      - --trust-remote-code
      - --tp-size
      - "1"
      - --attention-backend
      - flashinfer
      - --context-length
      - "262144"
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      - --mem-fraction-static
      - "0.85"
      - --enable-metrics
      - --max-running-requests
      - "16"
      - --chunked-prefill-size
      - "2048"
