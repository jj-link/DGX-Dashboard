services:
  diffusiongemma:
    image: lmsysorg/sglang:v0.5.12-cu130
    container_name: sglang-diffusiongemma
    restart: "no"
    ports:
      - "8001:30000"
    ipc: host
    shm_size: 32g
    volumes:
      - /home/workbench/inference:/workspace
    environment:
      HF_HOME: /tmp/hf_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - pip install --upgrade git+https://github.com/huggingface/transformers.git && python3 -m sglang.launch_server --model-path nvidia/diffusiongemma-26B-A4B-it-NVFP4 --host 0.0.0.0 --port 30000 --served-model-name diffusiongemma-26B-A4B-it-NVFP4 --trust-remote-code --tp-size 1 --attention-backend flashinfer --context-length 131072 --mem-fraction-static 0.85 --enable-metrics --max-running-requests 4 --chunked-prefill-size 2048
