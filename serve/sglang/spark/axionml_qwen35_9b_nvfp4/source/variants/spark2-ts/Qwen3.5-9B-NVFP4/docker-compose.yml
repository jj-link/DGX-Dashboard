services:
  qwen35-9b-nvfp4:
    image: lmsysorg/sglang:v0.5.12-cu130
    container_name: sglang-qwen35-9b-nvfp4
    restart: "no"
    ports:
      - "8001:30000"
    ipc: host
    shm_size: 32g
    volumes:
      - ${HOME}/models:/models
    environment:
      HF_HOME: /models
      HF_TOKEN: ${HF_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - AxionML/Qwen3.5-9B-NVFP4
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --served-model-name
      - Qwen3.5-9B-NVFP4
      - --trust-remote-code
      - --tp-size
      - "1"
      - --attention-backend
      - flashinfer
      - --mem-fraction-static
      - "0.85"
      - --enable-metrics
      - --max-running-requests
      - "8"
