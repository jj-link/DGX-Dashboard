# Rank 0 (spark2) — DeepSeek-V4-Flash-DSpark TP=2
# Launch on spark2: docker compose -f rank0-docker-compose.yml up -d
services:
  deepseek-v4-flash-rank0:
    image: vllm/vllm-openai:gemma
    container_name: vllm-deepseek-v4-flash-rank0
    restart: "no"
    network_mode: host
    volumes:
      - ${HOME}/models:/models
    environment:
      HF_HOME: /models
      VLLM_USE_V2_MODEL_RUNNER: "1"
      NCCL_SOCKET_IFNAME: enp1s0f1np1
      NCCL_IB_DISABLE: "1"
      NCCL_DEBUG: info
      MASTER_ADDR: "10.0.0.1"
      MASTER_PORT: "55555"
      RANK: "0"
      WORLD_SIZE: "2"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model /models/hub/models--deepseek-ai--DeepSeek-V4-Flash-DSpark
      --served-model-name DeepSeek-V4-Flash-DSpark
      --tensor-parallel-size 2
      --distributed-executor-backend mp
      --trust-remote-code
