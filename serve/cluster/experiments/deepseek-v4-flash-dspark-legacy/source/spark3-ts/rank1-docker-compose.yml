# Rank 1 (spark3) - DeepSeek-V4-Flash-DSpark TP=2
services:
  vllm-dspark:
    image: vllm-dspark-runtime:dspark-nvfp4-stage-c
    container_name: vllm-deepseek-v4-flash-rank1
    restart: "no"
    network_mode: host
    ipc: host
    shm_size: "64gb"
    volumes:
      - /home/jjlink/models:/models
    environment:
      HF_HOME: /models
      HF_HUB_DISABLE_XET: "1"
      TORCH_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_SKIP_INIT_MEMORY_CHECK: "1"
      VLLM_USE_B12X_MOE: "1"
      VLLM_USE_B12X_WO_PROJECTION: "1"
      VLLM_DSPARK_CONFIDENCE_THRESHOLD: "0.0"
      VLLM_DSPARK_CONFIDENCE_SCHEDULER: "off"
      VLLM_DSPARK_LOCAL_ARGMAX: "1"
      VLLM_DSPARK_REPLICATE_MARKOV_W1: "1"
      VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK: "1"
      VLLM_DSPARK_HARDWARE_SCHEDULER_EARLY_STOP: "1"
      VLLM_TRITON_MLA_SPARSE: "1"
      VLLM_HOST_IP: "10.0.0.2"
      NCCL_NET: Socket
      NCCL_IB_DISABLE: "1"
      NCCL_SOCKET_IFNAME: enp1s0f1np1
      NCCL_SOCKET_NTHREADS: "2"
      NCCL_CROSS_NIC: "1"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      GLOO_SOCKET_IFNAME: enp1s0f1np1
      NCCL_DEBUG: INFO
      MASTER_ADDR: "10.0.0.1"
      MASTER_PORT: "25000"
      NODE_RANK: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      vllm serve
      --model /models/hub/models--deepseek-ai--DeepSeek-V4-Flash-DSpark
      --served-model-name DeepSeek-V4-Flash-DSpark
      --host 0.0.0.0
      --port 8001
      --trust-remote-code
      --tensor-parallel-size 2
      --distributed-executor-backend mp
      --kv-cache-dtype nvfp4_ds_mla
      --block-size 256
      --max-model-len 1048576
      --max-num-seqs 6
      --max-num-batched-tokens 8192
      --gpu-memory-utilization 0.80
      --enable-prefix-caching
      --tokenizer-mode deepseek_v4
      --enable-auto-tool-choice
      --tool-call-parser deepseek_v4
      --nnodes 2
      --node-rank 1
      --master-addr 10.0.0.1
      --master-port 25000
      --headless
      --spec-method dspark
      --spec-tokens 5
