services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-qwen36-tp2
    restart: "no"
    privileged: true
    network_mode: host
    ipc: host
    shm_size: 32g
    ulimits:
      memlock: -1
    volumes:
      - /home/jjlink/models/hub:/models
      - /home/jjlink/models/token:/hf_token:ro
    environment:
      HF_HOME: /models
      HF_HUB_DISABLE_XET: "1"
      HF_TOKEN_FILE: /hf_token
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: rocep1s0f1
      NCCL_IB_GID_INDEX: "3"
      NCCL_CROSS_NIC: "1"
      NCCL_SOCKET_IFNAME: enp1s0f1np1
      GLOO_SOCKET_IFNAME: enp1s0f1np1
      TP_SOCKET_IFNAME: enp1s0f1np1
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - nvidia/Qwen3.6-27B-NVFP4
      - --served-model-name
      - qwen36-27b-nvfp4
      - --host
      - 0.0.0.0
      - --port
      - "8888"
      - --tensor-parallel-size
      - "2"
      - --distributed-executor-backend
      - mp
      - --nnodes
      - "2"
      - --node-rank
      - "0"
      - --master-addr
      - 10.0.0.1
      - --master-port
      - "25000"
      - --max-model-len
      - "262144"
      - --gpu-memory-utilization
      - "0.90"
      - --max-cudagraph-capture-size
      - "8"
      - --enable-prefix-caching
      - --trust-remote-code
      - --load-format
      - safetensors