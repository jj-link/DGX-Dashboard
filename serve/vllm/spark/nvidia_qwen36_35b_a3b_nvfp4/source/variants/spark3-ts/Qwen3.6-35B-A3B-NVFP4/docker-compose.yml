services:
  qwen36-a3b-nvfp4:
    image: vllm/vllm-openai:latest
    container_name: vllm-qwen36-a3b-nvfp4
    restart: "no"
    ports:
      - "8002:8000"
    ipc: host
    shm_size: 32g
    volumes:
      - ${HOME}/models:/models
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: /models
      VLLM_USE_V2_MODEL_RUNNER: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model nvidia/Qwen3.6-35B-A3B-NVFP4
      --served-model-name Qwen3.6-35B-A3B-NVFP4
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --max-model-len 262144
      --gpu-memory-utilization 0.85
      --max-num-batched-tokens 262144
      --max-num-seqs 4
      --attention-backend TRITON_ATTN
