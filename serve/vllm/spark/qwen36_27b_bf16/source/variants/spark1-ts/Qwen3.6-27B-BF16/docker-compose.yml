services:
  qwen36-27b-bf16:
    image: vllm-latest:0.21.0
    container_name: vllm-qwen36-27b-bf16
    restart: "no"
    ports:
      - "8000:8000"
    ipc: host
    shm_size: 32g
    volumes:
      - ${HOME}/models:/models
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: /models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model /models/hub/models--Qwen--Qwen3.6-27B/snapshots/6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
      --served-model-name Qwen3.6-27B-BF16
      --host 0.0.0.0
      --port 8000
      --max-model-len 262144
      --gpu-memory-utilization 0.85
      --max-num-batched-tokens 262144
