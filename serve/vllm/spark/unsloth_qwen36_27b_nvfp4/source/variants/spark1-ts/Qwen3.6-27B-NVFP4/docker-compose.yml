services:
  qwen36-27b-nvfp4:
    image: vllm-latest:0.21.0
    container_name: vllm-qwen36-27b-nvfp4
    restart: "no"
    ports:
      - "8000:8000"
    ipc: host
    shm_size: 32g
    volumes:
      - ${HOME}/models:/models
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: /models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model /models/hub/models--unsloth--Qwen3.6-27B-NVFP4/snapshots/6db17837b1c03a197fb45cef806e0c2a612c3aa7
      --served-model-name Qwen3.6-27B-NVFP4
      --host 0.0.0.0
      --port 8000
      --max-model-len 262144
      --gpu-memory-utilization 0.85
      --max-num-batched-tokens 262144
