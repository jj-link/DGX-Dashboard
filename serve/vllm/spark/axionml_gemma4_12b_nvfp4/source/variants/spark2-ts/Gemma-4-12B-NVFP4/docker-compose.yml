services:
  gemma4-12b-nvfp4:
    image: vllm/vllm-openai:gemma
    container_name: vllm-gemma4-12b-nvfp4
    restart: "no"
    ports:
      - "8001:8000"
    ipc: host
    shm_size: 32g
    volumes:
      - ${HOME}/models:/models
    environment:
      HF_HOME: /models
      VLLM_USE_V2_MODEL_RUNNER: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model AxionML/Gemma-4-12B-NVFP4
      --served-model-name Gemma-4-12B-NVFP4
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --max-num-seqs 8
      --max-cudagraph-capture-size 8
      --attention-backend TRITON_ATTN
      --enable-auto-tool-choice
      --tool-call-parser gemma4
      --reasoning-parser gemma4
      --override-generation-config "{\"max_new_tokens\": null}"
      --default-chat-template-kwargs "{\"enable_thinking\":true}"
