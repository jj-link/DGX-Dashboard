# Dashboard configuration

[server]
host = 127.0.0.1
port = 9000
refresh_interval = 3

[inference_servers]
local = vllm,http://localhost:8000
spark1 = vllm,http://100.86.3.45:8000
spark2 = vllm,http://100.92.139.82:8000
spark3 = vllm,http://100.121.117.65:8000
cluster = vllm,http://100.92.139.82:8888

[remote_hosts]
spark1 = spark1-ts
spark2 = spark2-ts
spark3 = spark3-ts

[benchmarks]
results_dir = /var/lib/dgx-dashboard/benchmark-results
aider_benchmarks_dir = /var/lib/dgx-dashboard/aider-benchmarks

[control]
enabled = false
allowed_origin = https://jjlink-pc-1.tail90c6fe.ts.net:8443
wrapper_root = /home/workbench/Projects/personal/dgx-dashboard
state_dir = /var/lib/dgx-dashboard/runs
polyglot_root = /var/lib/dgx-dashboard/polyglot-benchmark
targets = local,spark1,spark2,spark3,cluster
retention = 250
serving_timeout = 1800
benchmark_timeout = 86400
